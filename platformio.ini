; Waveshare ESP32-C6-LCD-1.47 (Amazon B0DK5J6LX3) — LCD only, no touch
;   pio run -t upload --upload-port /dev/cu.usbmodem*
;
; Arduino IDE: ESP32C6 Dev Module, USB CDC On Boot, 115200.

[platformio]
src_dir = slab-eyes

[env:waveshare_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32c6
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

upload_speed = 921600

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

lib_deps =
  moononournation/GFX Library for Arduino@^1.5.5
  adafruit/Adafruit NeoPixel@^1.12.3
